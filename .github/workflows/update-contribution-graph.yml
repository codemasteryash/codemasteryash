
name: Update Contribution Graph

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/generate-contribution-graph.mjs"
      - ".github/workflows/update-contribution-graph.yml"

permissions:
  contents: write

concurrency:
  group: update-contribution-graph
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate contribution graph
        env:
          GH_TOKEN: ${{ secrets.CONTRIBUTIONS_TOKEN }}
        run: node .github/scripts/generate-contribution-graph.mjs

      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contribution-graph.svg

          if git diff --cached --quiet; then
            echo "Contribution graph has not changed."
            exit 0
          fi

          git commit -m "chore: update contribution graph"
          git push
