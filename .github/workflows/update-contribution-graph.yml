
name: Update Profile Graphics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/**"
      - ".github/workflows/update-contribution-graph.yml"

permissions:
  contents: write

concurrency:
  group: update-profile-graphics
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify generator files
        run: |
          test -f .github/scripts/generate-contribution-graph.mjs
          test -f .github/scripts/generate-profile-achievements.mjs

      - name: Generate contribution graph
        env:
          GH_TOKEN: ${{ secrets.CONTRIBUTIONS_TOKEN }}
        run: node .github/scripts/generate-contribution-graph.mjs

      - name: Generate profile achievements
        env:
          GH_TOKEN: ${{ secrets.CONTRIBUTIONS_TOKEN }}
        run: node .github/scripts/generate-profile-achievements.mjs

      - name: Verify generated SVG files
        run: |
          test -s assets/contribution-graph.svg
          test -s assets/profile-achievements.svg
          ls -lh assets/*.svg

      - name: Commit generated SVG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contribution-graph.svg assets/profile-achievements.svg

          if git diff --cached --quiet; then
            echo "No changes to generated graphics."
            exit 0
          fi

          git commit -m "chore: update profile graphics"
          git push
